appId: app.threefm.desktop
productName: 3FM
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**
win:
  target: nsis
  icon: build/icon.png
  artifactName: 3FM-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: 3FM
  # Adds 3FM to "Open with" for STL, 3MF and G-code without taking over
  # their default program (electron-builder's fileAssociations would).
  include: build/installer.nsh
